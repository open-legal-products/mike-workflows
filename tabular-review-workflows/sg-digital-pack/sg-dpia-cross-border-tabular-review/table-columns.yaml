$schema: ../../../workflow-schema/table-columns.schema.yaml
columns:
- index: 0
  name: PDPA Application & Role Mapping
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied processing and transfer inventories, recipient contracts, due-diligence records, DPIA, control evidence, request logs and sign-off records; do not infer actual flows or effective controls from policy text. Assess whether the entity is an organisation within s 2(1), including an entity formed overseas or without a Singapore presence. Identify the Singapore nexus and any exclusion under s 4. Do not apply a goods-or-services test attributed to s 2(1A). Map the evidenced organisation and data-intermediary roles and accountable entity for each supplied flow. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 1
  name: Processing Inventory & Lawful Basis
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied processing and transfer inventories, recipient contracts, due-diligence records, DPIA, control evidence, request logs and sign-off records; do not infer actual flows or effective controls from policy text. Describe each evidenced processing purpose, data category, individual group, volume, source, retention and deletion practice. Determine the applicable consent requirements from s 14 and identified PDPC guidance and cite the precise passage; do not import a GDPR test. Identify the applicable exception under s 17 and the relevant Schedule: legitimate interests under First Schedule Part 3, or business improvement under the applicable provisions of the Second Schedule. Check each exception’s conditions separately. For NRIC and other national-identification numbers, identify current PDPC guidance and any advisory or enforcement developments, cite the relevant passage and determine its application to the supplied use case. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 2
  name: DPIA Necessity & PDPC Alignment
  format: tag
  tags:
  - DPIA warranted — high-risk/novel/large-scale processing
  - DPIA exists and follows PDPC DPIA framework
  - DPIA exists but outdated or incomplete
  - DPIA not warranted — routine processing
  - Sector overlay requires PIA (e.g. healthcare/finance codes)
  - Not assessed
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied processing and transfer inventories, recipient contracts, due-diligence records, DPIA, control evidence, request logs and sign-off records; do not infer actual flows or effective controls from policy text. Identify the dated PDPC Guide to Data Protection Impact Assessments and verify its currency from an identified official source; do not assert it is the latest guide. Determine whether a DPIA is warranted, any sector requirement and the recommended assessment steps from cited passages. Compare the supplied DPIA against those steps; label the necessity conclusion as an assessment. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 3
  name: Transfer-Limitation Obligation (s 26)
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied processing and transfer inventories, recipient contracts, due-diligence records, DPIA, control evidence, request logs and sign-off records; do not infer actual flows or effective controls from policy text. Assess compliance with s 26 and the prescribed requirements in Part 3 of the Personal Data Protection Regulations 2021, including the required comparable standard of protection and the applicable legally enforceable obligation or exception. Do not assert a former prescribed-whitelist regime. Identify the mechanism for each evidenced transfer and cite the contract or other protection evidence; do not assume effectiveness. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 4
  name: Recipient Comparability & Destination Risk
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied processing and transfer inventories, recipient contracts, due-diligence records, DPIA, control evidence, request logs and sign-off records; do not infer actual flows or effective controls from policy text. Assess each evidenced recipient and destination against the requirements derived from cited s 26 and the applicable Regulations. Cite official destination law for legal findings and supplied due diligence for recipient capabilities. Label supplementary contract, encryption, access or localisation measures as proposals; do not substitute destination reputation for the applicable transfer test. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 5
  name: Consent, Notification & Purpose Limitation
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied processing and transfer inventories, recipient contracts, due-diligence records, DPIA, control evidence, request logs and sign-off records; do not infer actual flows or effective controls from policy text. Assess consent and notice compliance under PDPA ss 13–20: the applicable consent or exception basis for each collection, use or disclosure, the notice''s content and timing (s 20 — notify collection, use or disclosure purposes on or before collection under s 20(1)(a), and any previously unnotified use or disclosure purpose before that use or disclosure under s 20(1)(b), subject to ss 20(3)–(5)), withdrawal-of-consent mechanics (s 16), and the purpose-limitation rule (s 18). Check notification of third-party disclosures and any transfer notification practice the organisation follows. Flag consents that are bundled, inferred without a reasonable basis, or stale relative to current purposes, and state the exception basis if consent is not relied on. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 6
  name: Data-Intermediary & Vendor Chain
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied processing and transfer inventories, recipient contracts, due-diligence records, DPIA, control evidence, request logs and sign-off records; do not infer actual flows or effective controls from policy text. Map each evidenced intermediary or foreign processor, documented instructions, contract terms and any missing vendor evidence. Under s 4(3), the organisation has the same obligations for data processed on its behalf and for its purposes by a data intermediary. Assess the intermediary’s own obligations and written-contract condition under s 4(2). Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 7
  name: Security & Breach Notification
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied processing and transfer inventories, recipient contracts, due-diligence records, DPIA, control evidence, request logs and sign-off records; do not infer actual flows or effective controls from policy text. Assess accuracy and completeness under s 23 where personal data is likely to be used to make a decision affecting the individual or disclosed to another organisation. Assess reasonable security arrangements separately under s 24. Assess breach assessment and notification under PDPA Part 6A and the identified current breach-notification regulations; cite separate provisions for triggers, assessment, Commission deadlines, individual notification and exceptions. Assess incident-detection and response capability only from supplied operational records. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 8
  name: Access, Correction & Care Obligations
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied processing and transfer inventories, recipient contracts, due-diligence records, DPIA, control evidence, request logs and sign-off records; do not infer actual flows or effective controls from policy text. Assess access and correction under ss 21 and 22 and cite applicable regulations for timelines, fees and refusal grounds. Assess accuracy and completeness under s 23 where personal data is likely to be used to make a decision affecting the individual or disclosed to another organisation. Assess reasonable security arrangements separately under s 24. Assess retention and any deletion/anonymisation practices or rights from identified current provisions and supplied evidence, including foreign-processor handling; do not assume a general erasure right. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 9
  name: DPIA Risk Register (PDPC Framework)
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied processing and transfer inventories, recipient contracts, due-diligence records, DPIA, control evidence, request logs and sign-off records; do not infer actual flows or effective controls from policy text. Populate the DPIA risk register in PDPC''s framework terms: for each processing activity, the risks to individuals (unauthorised access, misuse, disclosure, financial or reputational harm), likelihood and impact ratings, existing controls, and residual risk. Include risks arising specifically from cross-border processing (access by foreign authorities, weaker recipient environment, loss of oversight). State each risk''s owner and the treatment decision (mitigate / accept / avoid / transfer). Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 10
  name: Mitigations & Supplementary Measures
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied processing and transfer inventories, recipient contracts, due-diligence records, DPIA, control evidence, request logs and sign-off records; do not infer actual flows or effective controls from policy text. List the mitigations implemented or planned for each risk above the acceptable level: technical controls (encryption, access control, logging, pseudonymisation), organisational controls (policies, training, incident response, vendor management), and transfer-specific measures (contractual comparability clauses, restrictions on recipient subprocessing, localisation of the highest-risk data). For each measure state status (live / planned / owned by whom) and whether it responds to a PDPA obligation or is PDPC-guidance best practice. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 11
  name: Accountability Documentation & Governance
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied processing and transfer inventories, recipient contracts, due-diligence records, DPIA, control evidence, request logs and sign-off records; do not infer actual flows or effective controls from policy text. Assess supplied DPIA, consent, notice, policy, DPO, vendor, transfer and training records. Derive appointment and public-contact requirements from the identified statutory provisions, distinguishing guidance. Rank missing evidence by cited duty, demonstrated harm and deadline proximity; do not predict what an investigation would request first. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 12
  name: Gap Analysis & Remediation Plan
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied processing and transfer inventories, recipient contracts, due-diligence records, DPIA, control evidence, request logs and sign-off records; do not infer actual flows or effective controls from policy text. Propose a remediation plan with the evidenced gap, cited duty or guidance, assessed severity and rationale, evidenced owner/date or expressly proposed role/target. Use demonstrated harm, applicable legal requirements, control evidence and deadline proximity, not unsupported enforcement likelihood or informal hygiene labels. Identify architecture changes and proposed interim mitigation. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 13
  name: Sign-Off, Review Triggers & Residual Risk
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied processing and transfer inventories, recipient contracts, due-diligence records, DPIA, control evidence, request logs and sign-off records; do not infer actual flows or effective controls from policy text. Record only evidenced DPIA approval, approver, date and accepted residual risk from supplied sign-off records. Otherwise return Not found. Propose review intervals and triggers for changed purposes, recipients, vendors, law, guidance or incidents. Determine any regulator-engagement requirement or recommendation from an identified cited source; do not infer that high residual risk requires PDPC consultation. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 14
  name: Confidence & Open Questions
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use supplied processing and transfer inventories, recipient contracts, due-diligence records, DPIA, control evidence, request logs and sign-off records; do not infer actual flows or effective controls from policy text. Assess compliance with s 26 and the prescribed requirements in Part 3 of the Personal Data Protection Regulations 2021, including the required comparable standard of protection and the applicable legally enforceable obligation or exception. Do not assert a former prescribed-whitelist regime. State confidence and open questions for transfer, consent and gaps, identifying missing flow, subprocessing, contract or source evidence. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
