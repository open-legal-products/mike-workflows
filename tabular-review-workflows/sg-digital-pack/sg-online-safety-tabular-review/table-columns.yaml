$schema: ../../../workflow-schema/table-columns.schema.yaml
columns:
- index: 0
  name: Service & Designation Status (SG)
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified code/version and clauses, official designation notifications and any received directions, plus supplied service inventories, moderation/reporting records, metrics and correspondence. Do not presume designation or code application. Identify evidenced service type, Singapore access and reach, then determine scope under cited current Broadcasting Act Part 10A definitions and conditions. Establish designation only from the identified notification/current official list. Distinguish potential future designation as a labelled assessment. Determine commencement of relevant Online Safety (Miscellaneous Amendments) Act 2022 amendments from the identified commencement source; do not infer it from the enactment year. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 1
  name: Applicable Code & Legal Force
  format: tag
  tags:
  - Social-media code — application established by cited evidence
  - App-distribution code — application established by cited evidence
  - Possible future designation — assessment only
  - Received direction — application established by cited evidence
  - Out of scope — supported analysis
  - Application unresolved — source evidence needed
  - Not assessed
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified code/version and clauses, official designation notifications and any received directions, plus supplied service inventories, moderation/reporting records, metrics and correspondence. Do not presume designation or code application. Identify the exact applicable Code of Practice for Online Safety — Social Media Services or App Distribution Services, version, clause and statutory power. Determine designation and present application from cited official evidence, separately from possible future designation, received directions and guidance. Choose a current-application tag only when scope, commencement and designation conditions are established. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 2
  name: Harmful-Content Definitions & Scope
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified code/version and clauses, official designation notifications and any received directions, plus supplied service inventories, moderation/reporting records, metrics and correspondence. Do not presume designation or code application. Determine and quote the relevant egregious-content definitions from the current cited Act and harmful-content categories from the applicable identified code/version with pinpoint. Map each category to the source-backed duty; do not use an illustrative category list as the legal definition. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 3
  name: System-Level Measures Obligations
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified code/version and clauses, official designation notifications and any received directions, plus supplied service inventories, moderation/reporting records, metrics and correspondence. Do not presume designation or code application. For each code obligation imposing system-level measures, state what the code requires (with clause references): measures to minimise users'' exposure to harmful content (especially for children), content moderation systems proportionate to risk, and the specific duties for app distribution services (curtailing the risk of exposure to harmful content, age-appropriateness measures). Assess the organisation''s current implementation against each measure and identify the delta with the owning team. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 4
  name: User Reporting & Complaints Workflow
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified code/version and clauses, official designation notifications and any received directions, plus supplied service inventories, moderation/reporting records, metrics and correspondence. Do not presume designation or code application. Assess reporting, triage, response times, outcome notices and appeal routes against the applicable identified code/version and clause. Walk the supplied reporting workflow from report to queue, review, action and communication. Identify evidenced gaps against cited requirements; do not predict an IMDA assessment outcome. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 5
  name: Takedown & Direction-Response Workflow
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified code/version and clauses, official designation notifications and any received directions, plus supplied service inventories, moderation/reporting records, metrics and correspondence. Do not presume designation or code application. Assess readiness to respond to IMDA directions to disable access to egregious content: the compliance period specified in each written direction under s 45H(1)(d), including any extension allowed by IMDA, the operational capability to disable access by Singapore users to specific content quickly and reliably, the escalation path when a direction is received (legal review, technical execution, record-keeping), and the interface with the code''s proactive and reactive duties. Identify gaps in geographic access control, content identification, or internal authority that would delay a compliant response to a direction. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 6
  name: Child-Safety & Age-Appropriateness Measures
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified code/version and clauses, official designation notifications and any received directions, plus supplied service inventories, moderation/reporting records, metrics and correspondence. Do not presume designation or code application. Assess the measures directed at protecting children: the code''s expectations for safeguarding child users (age assurance where the code contemplates it, default safety settings, restrictions on harmful content exposure, app-store age-rating and parental-control expectations for app distribution services), and how the organisation''s product design implements or fails them. State which measures are live, which are planned, and which the code requires but the product does not currently support. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 7
  name: Transparency Reporting Obligations
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified code/version and clauses, official designation notifications and any received directions, plus supplied service inventories, moderation/reporting records, metrics and correspondence. Do not presume designation or code application. Assess the transparency-reporting obligations under the code: the online-safety report the code requires of designated services, its content (safety measures, content-action metrics, user-safety data), the reporting period and deadline, the audience (published for users and submitted to IMDA for compliance assessment), and any requirement to report additional safety metrics on request. State whether the organisation currently produces the report, whether the data pipeline supports the required metrics, and what would need to change to comply. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 8
  name: Content-Moderation Operations
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified code/version and clauses, official designation notifications and any received directions, plus supplied service inventories, moderation/reporting records, metrics and correspondence. Do not presume designation or code application. Assess supplied moderation systems, human-review capacity, Singapore-language/context coverage, reviewer training and escalation evidence against the applicable identified code clauses. Label capacity and risk conclusions as assessments with rationale; do not infer likely directions from a content category alone. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 9
  name: IMDA Engagement & Compliance History
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified code/version and clauses, official designation notifications and any received directions, plus supplied service inventories, moderation/reporting records, metrics and correspondence. Do not presume designation or code application. Record only supplied designation, assessment, direction, correspondence and consultation history. Label any inference about regulator focus as a limited assessment with supporting evidence, not a prediction. Propose clarification or engagement only for human approval. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 10
  name: Cross-Regime Interaction (SG)
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified code/version and clauses, official designation notifications and any received directions, plus supplied service inventories, moderation/reporting records, metrics and correspondence. Do not presume designation or code application. Determine interactions with current identified POFMA, Protection from Harassment Act, PDPA and relevant online-safety codes. For Penal Code 1871 and Undesirable Publications Act 1967, establish exact instrument identity, point-in-time status and relevant provisions from identified official sources and cite before determining application; report missing enactment particulars or source evidence. Assess possible conflicting duties only against cited passages and supplied facts. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 11
  name: Enforcement & Penalty Exposure (SG)
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified code/version and clauses, official designation notifications and any received directions, plus supplied service inventories, moderation/reporting records, metrics and correspondence. Do not presume designation or code application. State the enforcement exposure under the online-safety regime with references: IMDA''s powers to issue directions to disable access, directions to comply with the code, the penalty provisions in the Act for non-compliance (fines in Singapore dollars, per-day penalties for continuing contravention — quote the sections and amounts as enacted), and any avenue of appeal or review of IMDA decisions. Assess the organisation''s practical exposure if a direction were ignored or code compliance lapsed. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 12
  name: Gap Analysis & Remediation Plan
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified code/version and clauses, official designation notifications and any received directions, plus supplied service inventories, moderation/reporting records, metrics and correspondence. Do not presume designation or code application. Propose a remediation plan with the evidenced gap, cited duty or guidance, assessed severity and rationale, evidenced owner/date or expressly proposed role/target. Use demonstrated harm, applicable legal requirements, control evidence and deadline proximity, not unsupported enforcement likelihood or informal hygiene labels. Identify architecture changes and proposed interim mitigation. Derive online-safety duties from the applicable identified code clauses or statutory provisions; do not predict compliance-assessment failure. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 13
  name: Executive Summary & Priorities
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified code/version and clauses, official designation notifications and any received directions, plus supplied service inventories, moderation/reporting records, metrics and correspondence. Do not presume designation or code application. Draft an executive summary of no more than 250 words identifying source-established designation, current duties and evidenced operations. Label potential designation, operational changes, three priority actions and target dates as assessments/proposals with rationale; state missing evidence rather than assuming risk of inaction. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 14
  name: Confidence & Open Questions
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified code/version and clauses, official designation notifications and any received directions, plus supplied service inventories, moderation/reporting records, metrics and correspondence. Do not presume designation or code application. State confidence (high/medium/low) for the designation analysis, the code-obligation inventory, and each priority action. List open questions requiring verification: the service''s current designation status (check IMDA''s published lists and notifications), the current code text (IMDA''s site), and the current provisions of the Broadcasting Act''s online-safety part (Singapore Statutes Online). Where the code text, designation, or statutory provision is checkable against an official Singapore source, verify before answering; otherwise mark ''verify current status'' explicitly. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
