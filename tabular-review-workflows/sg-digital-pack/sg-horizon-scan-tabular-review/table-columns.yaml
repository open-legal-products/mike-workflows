$schema: ../../../workflow-schema/table-columns.schema.yaml
columns:
- index: 0
  name: Instrument Identification (SG)
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified instrument and official lifecycle sources, plus supplied product inventories, owner records, compliance evidence and prior engagement records for organisational mapping. Identify the exact title, Act/instrument number, issuer, jurisdiction, official source and point-in-time version. Verify passage/assent particulars and determine each amendment’s commencement from its identified provision and notification with pinpoint; the Online Safety (Miscellaneous Amendments) Act 2022 (No. 38 of 2022) is an identity example, not evidence of commencement. Return Not assessed for unidentified instruments. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 1
  name: Issuing & Administering Body (SG)
  format: tag
  tags:
  - Parliament (Act)
  - Government ministry (specify)
  - IMDA
  - PDPC / PDPA administration
  - MAS (monetary/financial)
  - Other statutory board (specify)
  - Multiple bodies (split by function)
  - Not assessed
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified instrument and official lifecycle sources, plus supplied product inventories, owner records, compliance evidence and prior engagement records for organisational mapping. Name the Singapore body that issued and will administer or enforce the instrument, using its exact styling, and tag the body type. Note where legislation is administered by one body but enforced through another (e.g. statutes administered by a ministry with operational enforcement by IMDA/PDPC), and where a code is issued by the regulator under a statutory power. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 2
  name: Legal Force & Regulated Class (SG)
  format: tag
  tags:
  - Act — determine force and commencement
  - Subsidiary legislation — determine force and commencement
  - Code of practice — determine scope and application
  - Direction / order — determine addressees and effective date
  - Guideline / framework — determine status
  - Consultation / draft — determine lifecycle stage
  - Not assessed
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified instrument and official lifecycle sources, plus supplied product inventories, owner records, compliance evidence and prior engagement records for organisational mapping. Determine legal force, regulated class/addressees and the applicable provisions from the particular identified instrument, enabling provision and any designation or direction with pinpoint citations. Determine commencement separately, including phased or pending provisions. Do not treat assent as in force, an Act as binding all persons, or a direction/code as operative without its conditions and effective date. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 3
  name: Status Tracker — SG Lifecycle
  format: tag
  tags:
  - Consultation open or published
  - Bill introduced / before Parliament
  - Assented — commencement pending
  - In force — full
  - In force — phased (note which provisions live)
  - Compliance deadline passed
  - Superseded / amended (note details)
  - Not assessed
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified instrument and official lifecycle sources, plus supplied product inventories, owner records, compliance evidence and prior engagement records for organisational mapping. Track the instrument''s status in the Singapore lifecycle accurately, verifying against official sources (Singapore Statutes Online for commencement; IMDA/PDPC/REACH pages for consultations and codes): is it a consultation paper, a Bill before Parliament, assented but not commenced, commenced in full or in phases, or already in application? If the status or commencement is not ascertainable, flag for verification instead of guessing. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 4
  name: Key Dates & Commencement (SG)
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified instrument and official lifecycle sources, plus supplied product inventories, owner records, compliance evidence and prior engagement records for organisational mapping. Extract each evidenced publication, consultation, passage/assent, commencement, transition and compliance date with pinpoint source. Identify the particular commencement provision and any required Gazette notification; do not assume s 1 or a general commencement convention applies. Report unestablished dates as Not found, not pending unless a cited source establishes that status. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 5
  name: Obligation Inventory (SG)
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified instrument and official lifecycle sources, plus supplied product inventories, owner records, compliance evidence and prior engagement records for organisational mapping. Extract each discrete obligation with pinpoint section, regulation, or code-clause references: who is bound (entity class, e.g. designated online communication services with significant reach or impact, app distribution services), what must be done (system-level measures, reporting, user-safety tools, transparency reports), and the trigger (continuing, event-based, on designation, annual). State whether the standard is absolute or qualified (''reasonable'', ''practicable''). Keep each obligation as its own enumerated item with its reference. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 6
  name: In-Scope Products & Services (SG)
  format: tag
  tags:
  - In-scope — product/service obligations (SG users)
  - In-scope — operational obligations (reporting, complaints, safety)
  - Designation established by cited evidence
  - Possible future designation — assessment only
  - Out of scope for current portfolio
  - Scope uncertain — legal confirmation needed
  - Not assessed
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified instrument and official lifecycle sources, plus supplied product inventories, owner records, compliance evidence and prior engagement records for organisational mapping. Map the instrument''s scope onto the organisation''s products and operations serving Singapore users: which products or features are within the instrument''s defined scope (using the instrument''s statutory definitions, e.g. online communication service, app distribution service, social media service), which are designated or could become designated, and which are outside. List each in-scope item explicitly. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 7
  name: Obligation-to-Product & Owner Map
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified instrument and official lifecycle sources, plus supplied product inventories, owner records, compliance evidence and prior engagement records for organisational mapping. For each obligation, name the in-scope product or workflow, the internal owner role (product, trust-and-safety, engineering, legal, policy), and dependencies. Identify obligations with no current owner, obligations landing on the same team with conflicting deadlines, and any obligation that requires a regulator-facing artefact (report to IMDA/PDPC, published transparency report, notice to users). Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 8
  name: Gap Analysis — Current vs Required (SG)
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified instrument and official lifecycle sources, plus supplied product inventories, owner records, compliance evidence and prior engagement records for organisational mapping. Compare supplied product/process/documentation evidence with each cited applicable obligation and date. Label effort, severity and priority as assessments with rationale. If current-state evidence is missing return Not assessed and request it; do not invent assumption-based product facts. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 9
  name: Compliance Workstream & Artefacts (SG)
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified instrument and official lifecycle sources, plus supplied product inventories, owner records, compliance evidence and prior engagement records for organisational mapping. Consolidate obligations into named workstreams with accountable owner roles and proposed target dates before each future legal deadline; where a legal deadline has passed, flag the missed deadline, retain its original date, and propose a future remediation date for human approval without treating it as an extension of the legal deadline: product changes, policy and process build, regulator-facing reports (e.g. IMDA annual online-safety reports for designated services), user-facing measures (reporting tools, safety settings), training, and contracting. Name the artefact each workstream produces and the regulator or channel it serves, and flag workstreams blocked on regulator guidance or designation. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 10
  name: Cross-Instrument Interaction (SG)
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified instrument and official lifecycle sources, plus supplied product inventories, owner records, compliance evidence and prior engagement records for organisational mapping. Map interactions with other Singapore instruments covering the same conduct: the parent Act and its subsidiary legislation, related codes (e.g. the social-media and app-distribution online-safety codes under the Broadcasting Act), PDPC rules and advisories where personal data is involved, the Protection from Online Falsehoods and Manipulation Act 2019 (POFMA) where content is involved, sector rules, and any express precedence or non-derogation clause. State the posture that satisfies all regimes and flag double-regulation or conflicting deadlines. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 11
  name: Enforcement & Penalty Exposure (SG)
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified instrument and official lifecycle sources, plus supplied product inventories, owner records, compliance evidence and prior engagement records for organisational mapping. State the Singapore enforcement toolkit and penalty exposure with references and figures as enacted (no currency conversion): regulator powers (directions, codes, investigations, composition sums), penalty bands (e.g. fines in Singapore dollars, per-day penalties, imprisonment where applicable), whether penalties fall on the entity or officers, and enforcement-start dates. Assess the organisation''s practical exposure if it took no action before the compliance deadline. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 12
  name: Consultation & Engagement Tracking
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified instrument and official lifecycle sources, plus supplied product inventories, owner records, compliance evidence and prior engagement records for organisational mapping. Track the instrument''s consultation history and the organisation''s engagement posture: past consultation papers and their response deadlines, the organisation''s submitted positions (if any), the regulator''s published responses or summaries, and any opportunity to engage on implementation (industry sessions, pilot or sandbox participation). Identify the current consultation window, if open, and the decision deadline for whether to respond. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 13
  name: Monitoring & Review Triggers (SG)
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified instrument and official lifecycle sources, plus supplied product inventories, owner records, compliance evidence and prior engagement records for organisational mapping. Define the forward monitoring plan for Singapore sources: Singapore Statutes Online updates, the Government Gazette, IMDA/PDPC regulator pages and consultation lists, REACH/AGC consultation listings, and parliamentary Bill tracking. Set the cadence and the trigger events that require re-running this map (new code, direction to the organisation, amendment, guidance publication, designation), and state the next expected milestone for this instrument if known. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 14
  name: Executive Summary & Priorities (SG)
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified instrument and official lifecycle sources, plus supplied product inventories, owner records, compliance evidence and prior engagement records for organisational mapping. Write a plain-English executive summary in no more than 250 words: WHAT the instrument does, WHO it binds, WHAT obligations land on the organisation''s SG-facing products, the three highest-priority actions with dates, and the single biggest risk of inaction. Suitable for a non-lawyer executive briefing on Singapore compliance. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 15
  name: Confidence & Open Questions (SG)
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the identified instrument and official lifecycle sources, plus supplied product inventories, owner records, compliance evidence and prior engagement records for organisational mapping. State confidence (high/medium/low) for the status stage, obligation inventory, and priorities. List open questions requiring verification against official Singapore sources: current commencement status (check Singapore Statutes Online), exact penalty figures, codes or subsidiary legislation not yet published, and regulator guidance in draft. Where the current text or status is checkable, verify before answering; otherwise flag ''verify current status'' explicitly. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
