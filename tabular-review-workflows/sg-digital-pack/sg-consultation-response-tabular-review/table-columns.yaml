$schema: ../../../workflow-schema/table-columns.schema.yaml
columns:
- index: 0
  name: Consultation Identification
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the complete consultation paper and official notice; use supplied organisational positions, evidence, prior filings and public statements, approval records and the full response draft for cross-question checks. Report missing or partial inputs and limit the comparison accordingly. Identify the consultation precisely: issuing regulator or ministry (exact name — e.g. IMDA, PDPC, AGC, MCI, MOM, MAS), paper title exactly as published, publication date, consultation reference number if any, response deadline date and submission channel (online form, email, REACH portal), and the instrument the consultation feeds (new Act, subsidiary legislation, code of practice, advisory guideline, framework). Verify the deadline and channel against the official page; if the response deadline has passed or is unknown, say so and ask whether to proceed on a best-efforts basis. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 1
  name: Issuing-Body Verification
  format: tag
  tags:
  - IMDA consultation
  - PDPC consultation
  - AGC / Ministry legislative consultation
  - MAS / other sector regulator consultation
  - Issuing body unclear or mismatched — verify before drafting
  - Statutory / Policy Consultation — Source-Established
  - Not assessed
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the complete consultation paper and official notice; use supplied organisational positions, evidence, prior filings and public statements, approval records and the full response draft for cross-question checks. Report missing or partial inputs and limit the comparison accordingly. Determine the actual issuer and statutory or policy character from the identified paper and cited enabling provision. Determine publication and confidentiality practice from the current official consultation terms, not a default assumption. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 2
  name: Consultation Type & Legal Consequence
  format: tag
  tags:
  - Legislation (Bill / subsidiary legislation) consultation
  - Code of practice / standard consultation
  - Advisory guideline / framework consultation
  - Policy position paper (non-binding outcome)
  - Outcome will bind designated entities
  - Outcome is guidance / best practice only
  - Not assessed
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the complete consultation paper and official notice; use supplied organisational positions, evidence, prior filings and public statements, approval records and the full response draft for cross-question checks. Report missing or partial inputs and limit the comparison accordingly. What kind of consultation is this and what hangs on the response? Tag the instrument trajectory and state what the regulator will do with the feedback (finalise a code or guideline, revise a Bill, publish a response summary). Distinguish consultations where the outcome binds the organisation (code under a statute, subsidiary legislation) from those that are guidance-shaping, and note any industry-engagement events (workshops, closed-door sessions) alongside the written consultation. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 3
  name: Question Reference Extraction
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the complete consultation paper and official notice; use supplied organisational positions, evidence, prior filings and public statements, approval records and the full response draft for cross-question checks. Report missing or partial inputs and limit the comparison accordingly. Extract every question, numbered item, or ''request for comment'' point in the consultation paper, preserving the regulator''s exact numbering and quoting the question text. For each, state its topic, the section of the paper it responds to, and whether it is a directed question (seeking a yes/no or specific position) or an open invitation for views. Do not merge or renumber the regulator''s questions; where the paper contains no numbered questions, list the issues by section and paragraph reference. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 4
  name: Stakeholder Position & Interest
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the complete consultation paper and official notice; use supplied organisational positions, evidence, prior filings and public statements, approval records and the full response draft for cross-question checks. Report missing or partial inputs and limit the comparison accordingly. For each question, state the organisation''s interest: which products, users, or business lines the issue affects, whether the organisation supports, opposes, or seeks modification of the proposal, and the strength of the position (core red-line vs flexible). Separate commercial interest from legal-compliance interest, and flag conflicts where a position that helps one business line harms another or the organisation''s stated values. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 5
  name: Issue & Option Analysis
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the complete consultation paper and official notice; use supplied organisational positions, evidence, prior filings and public statements, approval records and the full response draft for cross-question checks. Report missing or partial inputs and limit the comparison accordingly. For each supplied or expressly proposed position, assess the paper’s problem definition, regulatory/co-regulatory/self-regulatory/no-change options and trade-offs using cited evidence. Label preferred options and possible counterarguments as assessments, not the organisation’s approved recommendation or a prediction of the regulator’s response. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 6
  name: Legal & Regulatory Authority Map
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the complete consultation paper and official notice; use supplied organisational positions, evidence, prior filings and public statements, approval records and the full response draft for cross-question checks. Report missing or partial inputs and limit the comparison accordingly. For each substantive position, cite the legal and regulatory authorities that support or constrain it: existing Singapore statutes and subsidiary legislation (with section references), the regulator''s published guidelines and codes, prior consultation outcomes and response summaries, and where relevant comparable approaches in other jurisdictions (clearly labelled as comparative, not binding). Verify each authority is current (check Singapore Statutes Online for legislation and the regulator''s site for guidelines); mark any authority that cannot be verified as ''verify before finalising''. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 7
  name: Evidence & Data Support
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the complete consultation paper and official notice; use supplied organisational positions, evidence, prior filings and public statements, approval records and the full response draft for cross-question checks. Report missing or partial inputs and limit the comparison accordingly. Identify the evidence the organisation can marshal for each position: user data, safety or compliance metrics, technical feasibility analysis, cost estimates, incident data, and any prior engagement records with the regulator. For each piece of evidence, state its source, whether it is publishable in a public consultation response or should be marked confidential (and whether the regulator accepts confidential annexes), and whether the evidence is strong enough to carry the position or is merely illustrative. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 8
  name: Response Structure & Drafting Plan
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the complete consultation paper and official notice; use supplied organisational positions, evidence, prior filings and public statements, approval records and the full response draft for cross-question checks. Report missing or partial inputs and limit the comparison accordingly. Plan the response document structure following the regulator''s expected conventions: cover note (organisation, contact, confidentiality election), executive summary of positions, question-by-question responses preserving numbering, confidential annexes where needed, and any requested forms or templates. State the drafting conventions (concise paragraphs per question, position first then reasoning, plain English), the internal approval chain (subject-matter experts, legal, policy, sign-off level), and the production timeline working back from the deadline. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 9
  name: Draft Response Content
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the complete consultation paper and official notice; use supplied organisational positions, evidence, prior filings and public statements, approval records and the full response draft for cross-question checks. Report missing or partial inputs and limit the comparison accordingly. Draft the actual response content per question in the voice of the organisation''s regulatory counsel: clear position statement, concise reasoning with cited authority, requested modification in concrete drafting terms where the organisation proposes a change (suggested wording or principle), and acknowledgement of counterarguments. Where the organisation has no position or insufficient information, state that honestly with the reason rather than manufacturing a position. Flag every statement that asserts a fact requiring verification before submission. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 10
  name: Tone & Relationship Considerations
  format: tag
  tags:
  - Constructive engagement — ongoing regulator relationship
  - First-time submission
  - Contested / high-stakes context
  - Supportive submission (organisation agrees with proposals)
  - Critical submission (organisation opposes or seeks major change)
  - Balanced — support in part, seek modification in part
  - Not assessed
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the complete consultation paper and official notice; use supplied organisational positions, evidence, prior filings and public statements, approval records and the full response draft for cross-question checks. Report missing or partial inputs and limit the comparison accordingly. Assess the regulatory-relationship context: is this a constructive engagement with a regulator the organisation deals with regularly (IMDA/PDPC relationship), a first-time submission, or a response in a contested or enforcement-adjacent context? Tag the posture the draft should take, and state any language to avoid (overstatement, threats, unsubstantiated ''chilling innovation'' claims) and any signals to include (support for shared goals, offers to participate in pilots or working groups, implementation-readiness statements). Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 11
  name: Consistency & Cross-Check
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the complete consultation paper and official notice; use supplied organisational positions, evidence, prior filings and public statements, approval records and the full response draft for cross-question checks. Report missing or partial inputs and limit the comparison accordingly. Cross-check the full supplied response draft across every question, and compare only supplied prior submissions, public statements and regulatory filings. Cite exact conflicting passages and identify missing or partial comparison materials. Propose resolutions for human review rather than silently changing the organisation’s position. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 12
  name: Risk & Sensitivity Review
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the complete consultation paper and official notice; use supplied organisational positions, evidence, prior filings and public statements, approval records and the full response draft for cross-question checks. Report missing or partial inputs and limit the comparison accordingly. Assess the full supplied draft for sensitive statements, potential legal admissions, conflicts with cited current duties and reputational risks. Determine publication/confidentiality conditions from the actual official terms. Label annex allocation and further lawyer review as proposals for human decision. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 13
  name: Submission Mechanics & Record
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the complete consultation paper and official notice; use supplied organisational positions, evidence, prior filings and public statements, approval records and the full response draft for cross-question checks. Report missing or partial inputs and limit the comparison accordingly. Prepare a proposed submission checklist: official channel, deadline, file/form requirements and source-supported confidentiality rules. Record final-version approval, submitter, submission date and receipt only from supplied evidence; otherwise return Not found. Proposed roles and backstop times are not assignments or authorisation to submit. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 14
  name: Post-Submission Monitoring
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the complete consultation paper and official notice; use supplied organisational positions, evidence, prior filings and public statements, approval records and the full response draft for cross-question checks. Report missing or partial inputs and limit the comparison accordingly. Plan post-submission follow-through: tracking the regulator''s published response summary or decisions, mapping final outcomes back to the organisation''s positions (accepted / partially accepted / rejected), updating the internal obligation map if the final instrument binds the organisation, and scheduling any follow-up engagement (industry sessions, clarification requests, implementation working groups). State the owner of each follow-up item only where supported by supplied evidence; otherwise return Not found and label any suggested owner as a proposal for human approval, not an assignment. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
- index: 15
  name: Confidence & Open Questions
  format: text
  prompt: 'Distinguish document facts (cite the reviewed passage), operational facts (cite supplied organisational materials), external law or guidance (identify the current source/version and pinpoint provision), and labelled assessments or proposals. Return Not found for missing facts and Not assessed for unsupported analysis; do not infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Use the complete consultation paper and official notice; use supplied organisational positions, evidence, prior filings and public statements, approval records and the full response draft for cross-question checks. Report missing or partial inputs and limit the comparison accordingly. State confidence for extraction, cited authority and draft content, identifying missing organisational evidence and unresolved current-source questions. Verify the actual issuer, official deadline/channel and every relied-on legal provision; do not treat an unverified authority as background law. Proposed actions require human approval; do not submit, publish, approve deployment or accept residual risk. '
