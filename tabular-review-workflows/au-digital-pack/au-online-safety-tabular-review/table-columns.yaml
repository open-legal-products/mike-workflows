$schema: ../../../workflow-schema/table-columns.schema.yaml
columns:
- index: 0
  name: Service Class & Code Coverage (AU)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine the organisation’s evidenced service class under the Online Safety Act 2021 (Cth), applicable registered code/standard and schedule. Verify the current eSafety register and actual service-specific text instead of assuming coverage from a generic service label. The six additional age-restricted-material codes were registered on 9 September 2025 and commenced from 9 March 2026, with some measures commencing later. Identify the applicable service’s code or standard and each relevant measure’s commencement date; do not assume every measure applied on 9 March 2026. Use supplied service designs, complaints/moderation workflows, incident/referral records, age-assurance tests, reporting metrics/pipelines, control/owner records and sign-off evidence; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 1
  name: Material Class & Applicable Obligation Set
  format: tag
  tags:
  - Class 1A/1B — Unlawful Material Code or Standard
  - Class 1C/2 — Age-Restricted Material Code
  - Both unlawful-material and age-restricted-material sets
  - eSafety standard applies (no code registered for the class)
  - Basic online safety expectations apply
  - Service not covered by a registered code (state why)
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine service-specific material class and applicable code/standard or BOSE layer from current official text, with pinpoint definitions. Apply the registered Head Terms: class 1A material comprises child sexual exploitation material, pro-terror material and extreme crime and violence material, subject to the defined criteria. Class 1B is a subcategory of class 1 material comprising crime and violence material and drug-related material, in each case as further described in Annexure A of those Head Terms. Do not classify generic crime or violence material as class 1A. Apply the registered age-restricted Head Terms: class 1C is class 1 material describing or depicting specific fetish practices or fantasies, excluding class 1A material. Apply the definition of class 2 material in s 107 of the Online Safety Act 2021. Do not classify generic sexual content as class 1C. Separately, the class 1C/class 2 Code does not apply to class 1A or class 1B material (Head Terms, clause 3(c)); this is a coverage rule, not part of the class 1C definition. Tag only evidenced applicable sets and state unresolved scope. Use supplied service designs, complaints/moderation workflows, incident/referral records, age-assurance tests, reporting metrics/pipelines, control/owner records and sign-off evidence; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 2
  name: Code Provisions & Obligation Inventory
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Extract each actual obligation from the current applicable registered code/standard and service schedule with pinpoint clause, bound class, conditions, trigger and measure-specific date. Establish whether complaints, detection, takedown, age assurance, records or reporting duties apply rather than assuming all services share them. The six additional age-restricted-material codes were registered on 9 September 2025 and commenced from 9 March 2026, with some measures commencing later. Identify the applicable service’s code or standard and each relevant measure’s commencement date; do not assume every measure applied on 9 March 2026. Use supplied service designs, complaints/moderation workflows, incident/referral records, age-assurance tests, reporting metrics/pipelines, control/owner records and sign-off evidence; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 3
  name: Complaints-Handling Obligations
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Assess the complaints-handling obligations the applicable code imposes: the requirement to have a complaints system for the relevant material class, how complaints are made (accessibility, no unreasonable barriers), response and resolution timelines, the person responsible for complaints, what records must be kept, and how complainants are informed of outcomes (including the eSafety complaints route if the service does not resolve the complaint). Walk the current workflow end-to-end and identify gaps against the code's clause-level requirements. Use supplied service designs, complaints/moderation workflows, incident/referral records, age-assurance tests, reporting metrics/pipelines, control/owner records and sign-off evidence; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 4
  name: Reporting & Takedown Duties (Unlawful Material)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Apply the registered Head Terms: class 1A material comprises child sexual exploitation material, pro-terror material and extreme crime and violence material, subject to the defined criteria. Class 1B is a subcategory of class 1 material comprising crime and violence material and drug-related material, in each case as further described in Annexure A of those Head Terms. Do not classify generic crime or violence material as class 1A. Determine actual applicable detection/removal, eSafety or AFP reporting, timelines and evidence-preservation duties from current code/standard/statutory clauses. Do not assume a reporting duty for all material or services. Compare supplied incident/workflow/testing evidence and propose fixes separately. Use supplied service designs, complaints/moderation workflows, incident/referral records, age-assurance tests, reporting metrics/pipelines, control/owner records and sign-off evidence; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 5
  name: Age-Assurance & Restricted-Material Duties
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Apply the registered age-restricted Head Terms: class 1C is class 1 material describing or depicting specific fetish practices or fantasies, excluding class 1A material. Apply the definition of class 2 material in s 107 of the Online Safety Act 2021. Do not classify generic sexual content as class 1C. Separately, the class 1C/class 2 Code does not apply to class 1A or class 1B material (Head Terms, clause 3(c)); this is a coverage rule, not part of the class 1C definition. Determine service-specific age-assurance, age-gating, testing and access requirements from the applicable registered code and current clauses. Compare with supplied implementation and test evidence. The six additional age-restricted-material codes were registered on 9 September 2025 and commenced from 9 March 2026, with some measures commencing later. Identify the applicable service’s code or standard and each relevant measure’s commencement date; do not assume every measure applied on 9 March 2026. Use supplied service designs, complaints/moderation workflows, incident/referral records, age-assurance tests, reporting metrics/pipelines, control/owner records and sign-off evidence; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 6
  name: Proactive Measures & Moderation Systems
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Assess the proactive-measure obligations in the applicable code: what the code requires in detection technology, content moderation systems, and risk-minimisation measures for the material class in scope, and whether those measures must be proportionate to the service's size and function. Map the organisation's current moderation stack against each requirement and identify the delta, including any code requirement to review and update measures periodically. Use supplied service designs, complaints/moderation workflows, incident/referral records, age-assurance tests, reporting metrics/pipelines, control/owner records and sign-off evidence; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 7
  name: Transparency & Reporting Obligations
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Assess the transparency-reporting obligations in the applicable code: what the code requires the service to publish (safety measures, complaint metrics, enforcement outcomes) and to report to eSafety, the reporting period and deadline, and any code requirement to publish the report on the service's website. State whether the organisation currently produces the required report, whether the data pipeline supports the metrics, and what must change to comply — and note eSafety's parallel power to require information under the Act. Use supplied service designs, complaints/moderation workflows, incident/referral records, age-assurance tests, reporting metrics/pipelines, control/owner records and sign-off evidence; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 8
  name: Basic Online Safety Expectations
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine applicable expectations from the current Online Safety (Basic Online Safety Expectations) Determination 2022 and statutory reporting framework. Distinguish expectations, reporting/notice powers and code/standard duties; cite the specific power and trigger before stating a consequence of shortfall. Compare supplied safety/complaints/child-protection evidence. Use supplied service designs, complaints/moderation workflows, incident/referral records, age-assurance tests, reporting metrics/pipelines, control/owner records and sign-off evidence; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 9
  name: eSafety Powers & Direction Exposure
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine service-specific exposure to current Online Safety Act removal, blocking, end-user, information/reporting and standard-making powers from pinpoint provisions and conditions. Identify code/standard versus notice enforcement mechanisms separately; label practical-exposure assessment and proposed notice-response posture. Use supplied service designs, complaints/moderation workflows, incident/referral records, age-assurance tests, reporting metrics/pipelines, control/owner records and sign-off evidence; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 10
  name: Cross-Regime Interaction (AU)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine interactions with current Criminal Code/AFP provisions, the exact applicable classification instrument under the National Classification Scheme, identified state/territory content laws and Privacy Act duties for complaints/moderation data. Verify exact statutory title and applicable clauses before relying on any classification authority. Label EU comparisons separately; identify supported conflicts and proposed responses. Use supplied service designs, complaints/moderation workflows, incident/referral records, age-assurance tests, reporting metrics/pipelines, control/owner records and sign-off evidence; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 11
  name: Enforcement & Penalty Exposure (AU)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. State the enforcement exposure under the Online Safety Act and the codes with references and figures: eSafety's enforcement toolkit (investigations, infringement notices, civil penalties in penalty units — state the unit value at the relevant date), the penalty exposure for non-compliance with a code or standard and for failing to comply with notices, and any criminal exposure. Assess the organisation's practical exposure if it did not comply with the applicable code obligations, and note eSafety's published enforcement approach. Use supplied service designs, complaints/moderation workflows, incident/referral records, age-assurance tests, reporting metrics/pipelines, control/owner records and sign-off evidence; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 12
  name: Gap Analysis & Remediation Plan
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Propose remediation for evidenced gaps with applicable code/statutory clause, explicit likelihood/consequence/deadline criteria, documented owner or proposed team, proposed action and target date. Do not infer investigation likelihood or deployed fixes; product/architecture choices and residual-risk acceptance require human approval. Use supplied service designs, complaints/moderation workflows, incident/referral records, age-assurance tests, reporting metrics/pipelines, control/owner records and sign-off evidence; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 13
  name: Executive Summary & Priorities
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Write a plain-English executive summary in no more than 250 words: WHAT obligations bind the service in Australia, under WHICH code or standard, WHAT operational changes are required (complaints, takedown, age assurance, transparency), the three highest-priority actions with dates, and the single biggest risk of inaction. Suitable for a non-lawyer executive briefing on Australian online-safety compliance. Use supplied service designs, complaints/moderation workflows, incident/referral records, age-assurance tests, reporting metrics/pipelines, control/owner records and sign-off evidence; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 14
  name: Confidence & Open Questions
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. State confidence in service class, obligation inventory and priorities. Verify current eSafety register entry, actual code/standard version and service schedule, relevant Online Safety Act provision and each measure’s date. The six additional age-restricted-material codes were registered on 9 September 2025 and commenced from 9 March 2026, with some measures commencing later. Identify the applicable service’s code or standard and each relevant measure’s commencement date; do not assume every measure applied on 9 March 2026. Mark unresolved authority/input questions Not assessed; do not assume a single Head Terms date establishes all versions. Use supplied service designs, complaints/moderation workflows, incident/referral records, age-assurance tests, reporting metrics/pipelines, control/owner records and sign-off evidence; identify unavailable inputs. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."
