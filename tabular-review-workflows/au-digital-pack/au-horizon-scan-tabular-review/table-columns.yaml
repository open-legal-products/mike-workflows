$schema: ../../../workflow-schema/table-columns.schema.yaml
columns:
- index: 0
  name: Instrument Identification (AU)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Identify exact instrument title/year, Act or registration number, assent/registration date, type, issuer and Commonwealth or state/territory jurisdiction. If jurisdiction cannot be established, mark Not found and request clarification. Identify the jurisdiction first. Use legislation.gov.au for Commonwealth law; for state/territory law use that jurisdiction’s official legislation portal, parliamentary site and gazette/commencement source (NSW legislation.nsw.gov.au; Victoria legislation.vic.gov.au; Queensland legislation.qld.gov.au; WA legislation.wa.gov.au; SA legislation.sa.gov.au; Tasmania legislation.tas.gov.au; ACT legislation.act.gov.au; NT legislation.nt.gov.au). Cite the exact instrument, provision, point-in-time version, assent/registration and commencement source; the Federal Register is not the source for all Australian law. Use supplied product inventories, operational/control evidence, obligation maps, owner/approval records, prior positions and testing/implementation plans; distinguish these from official instruments and dates. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 1
  name: Issuing & Administering Body (AU)
  format: tag
  tags:
  - Parliament (Commonwealth Act)
  - eSafety Commissioner (online safety)
  - ACMA (communications/media)
  - OAIC (privacy)
  - ACCC / ASIC / APRA (market conduct/finance)
  - State/territory body (specify)
  - Multiple bodies (split by function)
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Name the Australian body that issued and will administer or enforce the instrument, using its exact styling, and tag the body type. Note where a code is developed by an industry body but registered and enforced by a regulator (e.g. eSafety registers and enforces online-safety codes and standards), and where responsibility is split across regulators. The six additional age-restricted-material codes were registered on 9 September 2025 and commenced from 9 March 2026, with some measures commencing later. Identify the applicable service’s code or standard and each relevant measure’s commencement date; do not assume every measure applied on 9 March 2026. Use supplied product inventories, operational/control evidence, obligation maps, owner/approval records, prior positions and testing/implementation plans; distinguish these from official instruments and dates. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk. Identify the jurisdiction first. Use legislation.gov.au for Commonwealth law; for state/territory law use that jurisdiction’s official legislation portal, parliamentary site and gazette/commencement source (NSW legislation.nsw.gov.au; Victoria legislation.vic.gov.au; Queensland legislation.qld.gov.au; WA legislation.wa.gov.au; SA legislation.sa.gov.au; Tasmania legislation.tas.gov.au; ACT legislation.act.gov.au; NT legislation.nt.gov.au). Cite the exact instrument, provision, point-in-time version, assent/registration and commencement source; the Federal Register is not the source for all Australian law."

- index: 2
  name: Legal Force & Regulated Class (AU)
  format: tag
  tags:
  - Act (Cth) — binding
  - Legislative instrument / delegated legislation — binding
  - Registered industry code — binding within scope
  - Industry standard (eSafety/ACMA) — binding where applied
  - Regulator guidance — non-binding
  - State/territory Act — binding
  - Exposure draft / consultation — not yet law
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine legal force, enforcement mechanism, regulated class, scope and commencement from the particular instrument and its enabling law with pinpoint citations. Distinguish Acts, delegated instruments, codes, standards, guidance and proposals; do not classify all codes or instruments as directly binding from their type alone. Identify the jurisdiction first. Use legislation.gov.au for Commonwealth law; for state/territory law use that jurisdiction’s official legislation portal, parliamentary site and gazette/commencement source (NSW legislation.nsw.gov.au; Victoria legislation.vic.gov.au; Queensland legislation.qld.gov.au; WA legislation.wa.gov.au; SA legislation.sa.gov.au; Tasmania legislation.tas.gov.au; ACT legislation.act.gov.au; NT legislation.nt.gov.au). Cite the exact instrument, provision, point-in-time version, assent/registration and commencement source; the Federal Register is not the source for all Australian law. Use supplied product inventories, operational/control evidence, obligation maps, owner/approval records, prior positions and testing/implementation plans; distinguish these from official instruments and dates. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 3
  name: Status Tracker — AU Lifecycle
  format: tag
  tags:
  - Consultation / exposure draft
  - Introduced / before Parliament
  - Assented — not yet commenced
  - In force — full
  - In force — partial/phased (note which provisions)
  - Compliance deadline passed
  - Superseded / amended (note details)
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Track consultation, parliamentary, assent, commencement, phased application and compliance status from official jurisdiction-specific sources, current code registers and exact commencement provisions. Do not infer dates or applicability from lifecycle labels. Identify the jurisdiction first. Use legislation.gov.au for Commonwealth law; for state/territory law use that jurisdiction’s official legislation portal, parliamentary site and gazette/commencement source (NSW legislation.nsw.gov.au; Victoria legislation.vic.gov.au; Queensland legislation.qld.gov.au; WA legislation.wa.gov.au; SA legislation.sa.gov.au; Tasmania legislation.tas.gov.au; ACT legislation.act.gov.au; NT legislation.nt.gov.au). Cite the exact instrument, provision, point-in-time version, assent/registration and commencement source; the Federal Register is not the source for all Australian law. The six additional age-restricted-material codes were registered on 9 September 2025 and commenced from 9 March 2026, with some measures commencing later. Identify the applicable service’s code or standard and each relevant measure’s commencement date; do not assume every measure applied on 9 March 2026. Use supplied product inventories, operational/control evidence, obligation maps, owner/approval records, prior positions and testing/implementation plans; distinguish these from official instruments and dates. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 4
  name: Key Dates & Commencement (AU)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. State sourced publication, consultation, assent, registration, provision/class-specific commencement, transitional and compliance dates. Identify any applicable default rule only after citing the governing jurisdiction’s rule and establishing its conditions; do not assume a generic six-month transition or Commonwealth default for state/territory law. Identify the jurisdiction first. Use legislation.gov.au for Commonwealth law; for state/territory law use that jurisdiction’s official legislation portal, parliamentary site and gazette/commencement source (NSW legislation.nsw.gov.au; Victoria legislation.vic.gov.au; Queensland legislation.qld.gov.au; WA legislation.wa.gov.au; SA legislation.sa.gov.au; Tasmania legislation.tas.gov.au; ACT legislation.act.gov.au; NT legislation.nt.gov.au). Cite the exact instrument, provision, point-in-time version, assent/registration and commencement source; the Federal Register is not the source for all Australian law. Use supplied product inventories, operational/control evidence, obligation maps, owner/approval records, prior positions and testing/implementation plans; distinguish these from official instruments and dates. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 5
  name: Obligation Inventory (AU)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Extract each discrete obligation with pinpoint references: section of the Act, clause of a registered industry code (e.g. eSafety code provisions on complaint handling, reporting illegal material, age assurance, transparency reporting), or term of a standard. For each state who is bound (e.g. providers of an 'app distribution service' defined in s 5 or a 'social media service' defined in s 13 of the Online Safety Act 2021, with provider scope under s 135 and the applicable registered code's service-specific schedule or industry standard), what must be done, and the trigger (continuing, event-based, on notice). Distinguish absolute duties from 'reasonable steps' qualified duties and note any safe harbour or immunity. Use supplied product inventories, operational/control evidence, obligation maps, owner/approval records, prior positions and testing/implementation plans; distinguish these from official instruments and dates. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk. Identify the jurisdiction first. Use legislation.gov.au for Commonwealth law; for state/territory law use that jurisdiction’s official legislation portal, parliamentary site and gazette/commencement source (NSW legislation.nsw.gov.au; Victoria legislation.vic.gov.au; Queensland legislation.qld.gov.au; WA legislation.wa.gov.au; SA legislation.sa.gov.au; Tasmania legislation.tas.gov.au; ACT legislation.act.gov.au; NT legislation.nt.gov.au). Cite the exact instrument, provision, point-in-time version, assent/registration and commencement source; the Federal Register is not the source for all Australian law."

- index: 6
  name: In-Scope Products & Services (AU)
  format: tag
  tags:
  - In-scope — product/service obligations (AU users)
  - In-scope — operational obligations (complaints, reporting, takedown)
  - Captured by registered code / standard
  - Adjacent — monitored but not captured
  - Out of scope for current portfolio
  - Scope uncertain — legal confirmation needed
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Map the instrument's scope onto the organisation's products serving Australian users: which products or services fall within the statutory definitions or industry-class scope (e.g. a service covered by an eSafety code schedule — social media, messaging, relevant electronic service, designated internet service, app distribution, hosting, search), which are captured or exempted, and which are outside. List each in-scope item explicitly. Use supplied product inventories, operational/control evidence, obligation maps, owner/approval records, prior positions and testing/implementation plans; distinguish these from official instruments and dates. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk. Identify the jurisdiction first. Use legislation.gov.au for Commonwealth law; for state/territory law use that jurisdiction’s official legislation portal, parliamentary site and gazette/commencement source (NSW legislation.nsw.gov.au; Victoria legislation.vic.gov.au; Queensland legislation.qld.gov.au; WA legislation.wa.gov.au; SA legislation.sa.gov.au; Tasmania legislation.tas.gov.au; ACT legislation.act.gov.au; NT legislation.nt.gov.au). Cite the exact instrument, provision, point-in-time version, assent/registration and commencement source; the Federal Register is not the source for all Australian law."

- index: 7
  name: Obligation-to-Product & Owner Map
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. For each obligation, name the in-scope product or operational workflow, the internal owner role (product, trust-and-safety, legal, policy, engineering), and dependencies. Identify obligations with no current owner, obligations requiring regulator-facing artefacts (eSafety transparency reports, ACMA reports, OAIC notifications), and conflicting deadlines across obligations landing on the same team. Use supplied product inventories, operational/control evidence, obligation maps, owner/approval records, prior positions and testing/implementation plans; distinguish these from official instruments and dates. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk. Identify the jurisdiction first. Use legislation.gov.au for Commonwealth law; for state/territory law use that jurisdiction’s official legislation portal, parliamentary site and gazette/commencement source (NSW legislation.nsw.gov.au; Victoria legislation.vic.gov.au; Queensland legislation.qld.gov.au; WA legislation.wa.gov.au; SA legislation.sa.gov.au; Tasmania legislation.tas.gov.au; ACT legislation.act.gov.au; NT legislation.nt.gov.au). Cite the exact instrument, provision, point-in-time version, assent/registration and commencement source; the Federal Register is not the source for all Australian law."

- index: 8
  name: Gap Analysis — Current vs Required (AU)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Compare supplied product/process/documentation evidence against each sourced obligation and compliance date. Label effort/severity as assessment with explicit criteria. If current-state evidence is absent return Not assessed for the comparison and identify needed evidence; do not fabricate an assumption-based current state. Use supplied product inventories, operational/control evidence, obligation maps, owner/approval records, prior positions and testing/implementation plans; distinguish these from official instruments and dates. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk. Identify the jurisdiction first. Use legislation.gov.au for Commonwealth law; for state/territory law use that jurisdiction’s official legislation portal, parliamentary site and gazette/commencement source (NSW legislation.nsw.gov.au; Victoria legislation.vic.gov.au; Queensland legislation.qld.gov.au; WA legislation.wa.gov.au; SA legislation.sa.gov.au; Tasmania legislation.tas.gov.au; ACT legislation.act.gov.au; NT legislation.nt.gov.au). Cite the exact instrument, provision, point-in-time version, assent/registration and commencement source; the Federal Register is not the source for all Australian law."

- index: 9
  name: Compliance Workstream & Artefacts (AU)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Propose workstreams for evidenced obligations: product/safety tooling, complaint handling, reports, user measures, training and contracts. Identify a reporting duty, frequency, deadline and channel from the applicable clause before assuming annual transparency reporting. Distinguish evidenced owners and deadlines from proposed owners, target dates, effort and artefacts; flag source/input blockers. Use supplied product inventories, operational/control evidence, obligation maps, owner/approval records, prior positions and testing/implementation plans; distinguish these from official instruments and dates. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk. Identify the jurisdiction first. Use legislation.gov.au for Commonwealth law; for state/territory law use that jurisdiction’s official legislation portal, parliamentary site and gazette/commencement source (NSW legislation.nsw.gov.au; Victoria legislation.vic.gov.au; Queensland legislation.qld.gov.au; WA legislation.wa.gov.au; SA legislation.sa.gov.au; Tasmania legislation.tas.gov.au; ACT legislation.act.gov.au; NT legislation.nt.gov.au). Cite the exact instrument, provision, point-in-time version, assent/registration and commencement source; the Federal Register is not the source for all Australian law."

- index: 10
  name: Cross-Instrument Interaction (AU)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Map interactions with other Australian instruments covering the same conduct: the parent Act and related delegated legislation, other codes/standards under the Online Safety Act, the Broadcasting Services Act 1992 (Cth) and ACMA rules for media/content, Privacy Act and APPs where personal information is involved, the Competition and Consumer Act 2010 (Cth)/ACL for consumer-facing conduct, and state/territory law where relevant. State the posture that satisfies all regimes and flag double-regulation or conflicting deadlines, including the interaction between eSafety codes and the basic online safety expectations. Use supplied product inventories, operational/control evidence, obligation maps, owner/approval records, prior positions and testing/implementation plans; distinguish these from official instruments and dates. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk. Identify the jurisdiction first. Use legislation.gov.au for Commonwealth law; for state/territory law use that jurisdiction’s official legislation portal, parliamentary site and gazette/commencement source (NSW legislation.nsw.gov.au; Victoria legislation.vic.gov.au; Queensland legislation.qld.gov.au; WA legislation.wa.gov.au; SA legislation.sa.gov.au; Tasmania legislation.tas.gov.au; ACT legislation.act.gov.au; NT legislation.nt.gov.au). Cite the exact instrument, provision, point-in-time version, assent/registration and commencement source; the Federal Register is not the source for all Australian law."

- index: 11
  name: Enforcement & Penalty Exposure (AU)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. State the Australian enforcement toolkit and penalty exposure with references and figures as enacted (no currency conversion): regulator powers (investigations, infringement notices, enforceable undertakings, court proceedings), penalty units and their dollar value as set at the relevant date (note penalty-unit indexation), civil penalties, and any criminal exposure. Assess the organisation's practical exposure if it took no action before the compliance deadline, and note whether penalties attach to the body corporate or individuals. Use supplied product inventories, operational/control evidence, obligation maps, owner/approval records, prior positions and testing/implementation plans; distinguish these from official instruments and dates. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk. Identify the jurisdiction first. Use legislation.gov.au for Commonwealth law; for state/territory law use that jurisdiction’s official legislation portal, parliamentary site and gazette/commencement source (NSW legislation.nsw.gov.au; Victoria legislation.vic.gov.au; Queensland legislation.qld.gov.au; WA legislation.wa.gov.au; SA legislation.sa.gov.au; Tasmania legislation.tas.gov.au; ACT legislation.act.gov.au; NT legislation.nt.gov.au). Cite the exact instrument, provision, point-in-time version, assent/registration and commencement source; the Federal Register is not the source for all Australian law."

- index: 12
  name: Consultation & Engagement Tracking
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Track the instrument's consultation history and the organisation's engagement posture: past consultation papers and response deadlines (e.g. eSafety code development consultations, ACMA or government policy consultations), the organisation's submitted positions, the regulator's published decisions and explanatory statements (e.g. eSafety's registration statements for codes), and upcoming engagement opportunities. Identify the current open consultation, if any, and the decision deadline for responding. Use supplied product inventories, operational/control evidence, obligation maps, owner/approval records, prior positions and testing/implementation plans; distinguish these from official instruments and dates. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk. Identify the jurisdiction first. Use legislation.gov.au for Commonwealth law; for state/territory law use that jurisdiction’s official legislation portal, parliamentary site and gazette/commencement source (NSW legislation.nsw.gov.au; Victoria legislation.vic.gov.au; Queensland legislation.qld.gov.au; WA legislation.wa.gov.au; SA legislation.sa.gov.au; Tasmania legislation.tas.gov.au; ACT legislation.act.gov.au; NT legislation.nt.gov.au). Cite the exact instrument, provision, point-in-time version, assent/registration and commencement source; the Federal Register is not the source for all Australian law."

- index: 13
  name: Monitoring & Review Triggers (AU)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Propose monitoring of current official sources and jurisdiction-specific parliamentary/commencement routes. Identify the jurisdiction first. Use legislation.gov.au for Commonwealth law; for state/territory law use that jurisdiction’s official legislation portal, parliamentary site and gazette/commencement source (NSW legislation.nsw.gov.au; Victoria legislation.vic.gov.au; Queensland legislation.qld.gov.au; WA legislation.wa.gov.au; SA legislation.sa.gov.au; Tasmania legislation.tas.gov.au; ACT legislation.act.gov.au; NT legislation.nt.gov.au). Cite the exact instrument, provision, point-in-time version, assent/registration and commencement source; the Federal Register is not the source for all Australian law. The six additional age-restricted-material codes were registered on 9 September 2025 and commenced from 9 March 2026, with some measures commencing later. Identify the applicable service’s code or standard and each relevant measure’s commencement date; do not assume every measure applied on 9 March 2026. Cite known milestones; otherwise return Not found rather than forecasting dates. Label cadence, owners and re-review triggers as proposals. Use supplied product inventories, operational/control evidence, obligation maps, owner/approval records, prior positions and testing/implementation plans; distinguish these from official instruments and dates. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 14
  name: Executive Summary & Priorities (AU)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Write a plain-English executive summary in no more than 250 words: WHAT the instrument does, WHO it binds, WHAT obligations land on the organisation's AU-facing products, the three highest-priority actions with dates, and the single biggest risk of inaction. Suitable for a non-lawyer executive briefing on Australian compliance. Use supplied product inventories, operational/control evidence, obligation maps, owner/approval records, prior positions and testing/implementation plans; distinguish these from official instruments and dates. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk. Identify the jurisdiction first. Use legislation.gov.au for Commonwealth law; for state/territory law use that jurisdiction’s official legislation portal, parliamentary site and gazette/commencement source (NSW legislation.nsw.gov.au; Victoria legislation.vic.gov.au; Queensland legislation.qld.gov.au; WA legislation.wa.gov.au; SA legislation.sa.gov.au; Tasmania legislation.tas.gov.au; ACT legislation.act.gov.au; NT legislation.nt.gov.au). Cite the exact instrument, provision, point-in-time version, assent/registration and commencement source; the Federal Register is not the source for all Australian law."

- index: 15
  name: Confidence & Open Questions (AU)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. State evidence-based confidence in lifecycle status, inventory and priorities. Identify unresolved commencement, current instrument/code version, penalty-unit values and factual inputs; verify each against the correct official jurisdiction source or mark Not assessed. Identify the jurisdiction first. Use legislation.gov.au for Commonwealth law; for state/territory law use that jurisdiction’s official legislation portal, parliamentary site and gazette/commencement source (NSW legislation.nsw.gov.au; Victoria legislation.vic.gov.au; Queensland legislation.qld.gov.au; WA legislation.wa.gov.au; SA legislation.sa.gov.au; Tasmania legislation.tas.gov.au; ACT legislation.act.gov.au; NT legislation.nt.gov.au). Cite the exact instrument, provision, point-in-time version, assent/registration and commencement source; the Federal Register is not the source for all Australian law. Use supplied product inventories, operational/control evidence, obligation maps, owner/approval records, prior positions and testing/implementation plans; distinguish these from official instruments and dates. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."
