$schema: ../../../workflow-schema/table-columns.schema.yaml
columns:
- index: 0
  name: Document & Flow Identification
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Identify supplied privacy-policy/notice/consent-flow versions and dates, collection touchpoints and flow evidence. Determine APP-entity and s 6D small-business status with exceptions from current authority and supplied organisational evidence. Assess Australian link under s 5B(2)–(3). For an overseas organisation not covered by s 5B(2), assess whether it carries on business in Australia or an external Territory. Do not treat collection of personal information in Australia as a standalone Australian-link test. Identify any GDPR-style wording and establish applicable Australian rights/tests before calling it incorrect. Use supplied full notice versions, entity records, actual flow/recipient maps, screen journeys, consent logs, rights/marketing-channel tests, owners and sign-off records; notice text alone does not prove operation. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 1
  name: Privacy Policy Content (APP 1)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Assess current APP 1.4 policy content: kinds collected/held (a), how collected/held (b), purposes (c), access/correction (d), complaints/how dealt with (e), likely overseas disclosure (f) and countries if practicable (g). Assess clear/current policy and availability under APP 1.3–1.5 against supplied text and actual-practice evidence. Assess existing privacy-policy duties under APP 1.3–1.5. Treat the dedicated automated-decision privacy-policy amendments in Schedule 1 Part 15 of the Privacy and Other Legislation Amendment Act 2024 as commencing on 10 December 2026, not as current APP 1.4 duties. Determine current enactment and commencement status of each relevant reform from the Federal Register of Legislation and AGD/OAIC official sources, citing the instrument, provision, version, commencement table and assessment date. Separate proposals, enacted future duties and commenced duties; do not describe an enacted reform as merely proposed or assume a proposal is law. Use supplied full notice versions, entity records, actual flow/recipient maps, screen journeys, consent logs, rights/marketing-channel tests, owners and sign-off records; notice text alone does not prove operation. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 2
  name: Collection Notification (APP 5)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Assess each APP 5 collection notice: does it notify (at or before collection, or as soon as practicable after) the matters in APP 5.2 — the entity's identity and contact details, that collection has occurred or is occurring, the purposes of collection, the main consequences (if any) of not providing the information, the main third parties or types of third parties to which it discloses personal information, access/correction and complaint mechanisms, and whether disclosure to overseas recipients is likely, with the countries involved where practicable? Assess timing and accessibility at each collection point and flag collections with no notice at all. Use supplied full notice versions, entity records, actual flow/recipient maps, screen journeys, consent logs, rights/marketing-channel tests, owners and sign-off records; notice text alone does not prove operation. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 3
  name: Collection Rules & Lawfulness (APP 3)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Assess APP 3.1 for agencies: collection must be reasonably necessary for, or directly related to, one or more functions or activities. Assess APP 3.2 for organisations: collection must be reasonably necessary for one or more functions or activities. Assess whether collection uses lawful and fair means under APP 3.5. If evaluating intrusive collection as an indicator of unfairness, distinguish that guidance-based analysis from the express statutory wording. Assess APP 3.6 direct collection and its agency/organisation-specific exceptions, and sensitive-information necessity/consent under APP 3.3 or a current APP 3.4 exception. Establish each condition from law and supplied collection evidence. Use supplied full notice versions, entity records, actual flow/recipient maps, screen journeys, consent logs, rights/marketing-channel tests, owners and sign-off records; notice text alone does not prove operation. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 4
  name: Use & Disclosure Basis (APP 6)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. For each evidenced use/disclosure, determine primary-purpose treatment or the exact secondary-purpose basis under APP 6.1(a), APP 6.2 or APP 6.3, as applicable. Assess APP 6.2(a) reasonable expectations and related/directly related purpose as applicable; consent is in APP 6.1(a), required/authorised law or court/tribunal order in APP 6.2(b), and permitted general situations including s 16A in APP 6.2(c). Verify the full applicable text and conditions before reliance; assess affiliates/advertising/analytics explicitly. Use supplied full notice versions, entity records, actual flow/recipient maps, screen journeys, consent logs, rights/marketing-channel tests, owners and sign-off records; notice text alone does not prove operation. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 5
  name: Consent Mechanics & Sensitive Information
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Where evidenced flows rely on consent, assess sensitive-information requirements and exceptions under APP 3.3–3.4 and current identified OAIC informed, voluntary, current/specific consent guidance. Compare supplied wording, choices, logs and testing; do not infer consent from notice wording or silence. The Privacy Act does not impose a universal PIA requirement. Agencies covered by the Privacy (Australian Government Agencies — Governance) APP Code 2017 must conduct a PIA for all high privacy risk projects. Assess whether that Code applies; otherwise use OAIC guidance to determine whether a PIA is warranted. Verify current Code registration/version and cl 12 before applying it. Use supplied full notice versions, entity records, actual flow/recipient maps, screen journeys, consent logs, rights/marketing-channel tests, owners and sign-off records; notice text alone does not prove operation. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 6
  name: Third-Party Disclosures & Sharing
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Assess recipient descriptions and each evidenced third-party sharing flow. Determine from actual control/access arrangements and current cited OAIC APP 6 guidance whether contracted-provider handling is a use or disclosure; do not categorically treat all contracted providers as disclosures. Where it is a disclosure, assess whether it is analysed under APP 6 and identify the applicable basis. Flag unsupported boilerplate separately from operational findings. Use supplied full notice versions, entity records, actual flow/recipient maps, screen journeys, consent logs, rights/marketing-channel tests, owners and sign-off records; notice text alone does not prove operation. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 7
  name: Cross-Border Disclosure Transparency (APP 8)
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine overseas-disclosure policy content under APP 1.4(f)–(g) and collection notification under APP 5.2(i)–(j), including countries where practicable. Compare supplied actual flows and recipients with wording and evidenced APP 8.1 reasonable steps. For APP 8.2(a), assess the reasonable belief that the recipient is subject to a substantially similar protective law or binding scheme and that the individual can access mechanisms to enforce that protection. For APP 8.2(b), assess express informed consent after telling the individual that APP 8.1 will not apply to the disclosure. Assess existing privacy-policy duties under APP 1.3–1.5. Treat the dedicated automated-decision privacy-policy amendments in Schedule 1 Part 15 of the Privacy and Other Legislation Amendment Act 2024 as commencing on 10 December 2026, not as current APP 1.4 duties. Determine current enactment and commencement status of each relevant reform from the Federal Register of Legislation and AGD/OAIC official sources, citing the instrument, provision, version, commencement table and assessment date. Separate proposals, enacted future duties and commenced duties; do not describe an enacted reform as merely proposed or assume a proposal is law. Use supplied full notice versions, entity records, actual flow/recipient maps, screen journeys, consent logs, rights/marketing-channel tests, owners and sign-off records; notice text alone does not prove operation. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 8
  name: Access, Correction & Complaint Mechanics
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Assess supplied access/correction procedures and tests under APP 12–13 with current conditions and timing. Assess the APP 1.4 privacy-policy information about how an individual can complain and how the entity will deal with the complaint. Assess requested copies separately under APP 1.6. Distinguish published channel wording from tested operation; do not assume a working complaints or OAIC escalation route. Use supplied full notice versions, entity records, actual flow/recipient maps, screen journeys, consent logs, rights/marketing-channel tests, owners and sign-off records; notice text alone does not prove operation. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 9
  name: Marketing & Direct-Messaging Practices
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Determine marketing coverage and requirements from current APP 7 and any applicable APP 6 provision; assess applicable Spam Act 2003 consent/unsubscribe conditions. Identify and cite the exact current Do Not Call Register Act 2006 from legislation.gov.au and relevant ACMA official guidance before assessing telemarketing duties; do not rely on a mismatched search-result Act. Compare supplied marketing journeys and unsubscribe/opt-out tests. Use supplied full notice versions, entity records, actual flow/recipient maps, screen journeys, consent logs, rights/marketing-channel tests, owners and sign-off records; notice text alone does not prove operation. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 10
  name: Children, Sensitive Data & Vulnerable Groups
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Where flows involve children, sensitive information, or vulnerable groups, assess the heightened expectations: OAIC's guidance on children's privacy (capacity to consent, age-appropriate communication), the stricter APP 3.3 consent requirement for sensitive information, and any sector overlays (health, credit reporting under Part IIIA). State whether the notice and consent approach would withstand OAIC scrutiny for these groups, including whether design choices (dark patterns, pre-ticked boxes) undermine valid consent. Use supplied full notice versions, entity records, actual flow/recipient maps, screen journeys, consent logs, rights/marketing-channel tests, owners and sign-off records; notice text alone does not prove operation. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 11
  name: Automated-Decision Transparency
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Assess existing APP 1/5 disclosure duties and current identified OAIC automated-decision guidance against supplied notice and system evidence. Assess existing privacy-policy duties under APP 1.3–1.5. Treat the dedicated automated-decision privacy-policy amendments in Schedule 1 Part 15 of the Privacy and Other Legislation Amendment Act 2024 as commencing on 10 December 2026, not as current APP 1.4 duties. Determine current enactment and commencement status of each relevant reform from the Federal Register of Legislation and AGD/OAIC official sources, citing the instrument, provision, version, commencement table and assessment date. Separate proposals, enacted future duties and commenced duties; do not describe an enacted reform as merely proposed or assume a proposal is law. State sourced present duties, enacted future duties and proposed wording separately; do not describe the dedicated amendments as merely proposals. Use supplied full notice versions, entity records, actual flow/recipient maps, screen journeys, consent logs, rights/marketing-channel tests, owners and sign-off records; notice text alone does not prove operation. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 12
  name: Clause-by-Clause Redline
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Produce a clause-by-clause review of the notice texts: for each clause, quote it, state the APP/OAIC issue it raises, its severity (critical APP breach / material risk / drafting improvement), and a concrete redline suggestion, preserving the document's numbering. Where a clause is compliant, say so briefly with the reason, so the review is a complete audit. Where a clause asserts a GDPR concept that the APPs do not require (e.g. mandatory erasure, consent for all cookies-type processing), flag the mismatch and the correct APP treatment. Use supplied full notice versions, entity records, actual flow/recipient maps, screen journeys, consent logs, rights/marketing-channel tests, owners and sign-off records; notice text alone does not prove operation. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 13
  name: Consent-Flow & User-Journey Walkthrough
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Walk through each collection and consent flow end-to-end as an Australian user would experience it: what the user sees at each step, where the collection notice appears relative to collection, whether consent screens (where used) are designed without dark patterns, and whether choices are genuinely available. Identify steps that would fail OAIC's expectations of transparency and fairness or attract regulator or community criticism. Use supplied full notice versions, entity records, actual flow/recipient maps, screen journeys, consent logs, rights/marketing-channel tests, owners and sign-off records; notice text alone does not prove operation. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 14
  name: Gap Analysis & Remediation Plan
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. Propose remediation for supported findings with APP provision, explicit severity criteria, documented owner or proposed owner, proposed fix and target date. Prioritise evidenced flow/transfer risks by supported urgency; product/architecture changes require human approval. Determine current enactment and commencement status of each relevant reform from the Federal Register of Legislation and AGD/OAIC official sources, citing the instrument, provision, version, commencement table and assessment date. Separate proposals, enacted future duties and commenced duties; do not describe an enacted reform as merely proposed or assume a proposal is law. Do not assert that an unresolved reform will inevitably force an action. Use supplied full notice versions, entity records, actual flow/recipient maps, screen journeys, consent logs, rights/marketing-channel tests, owners and sign-off records; notice text alone does not prove operation. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."

- index: 15
  name: Confidence & Open Questions
  format: text
  prompt: "Establish applicability and any requirement from the current identified official instrument/guidance before applying the tests below. State confidence (high/medium/low) for each finding. List open questions: facts needed from the business (actual flows, recipients, overseas destinations), OAIC positions that may have evolved (verify against OAIC's current guides), and the current status of Privacy Act reform items that would change the analysis (verify against the Federal Register of Legislation and the AGD/OAIC pages). Where a provision or guidance is checkable, verify before answering; otherwise mark explicitly. Do not import GDPR standards as APP requirements. Use supplied full notice versions, entity records, actual flow/recipient maps, screen journeys, consent logs, rights/marketing-channel tests, owners and sign-off records; notice text alone does not prove operation. Separate document facts, supplied organisational materials (identify source/version), cited law with pinpoint references and current official-source version/status, and labelled assessments/proposals. Return Not found for missing facts and Not assessed for unsupported analysis. Never infer consent, ownership, approval, deadlines, prior positions or deployed controls from silence. Proposed actions require human approval; do not submit, publish, deploy or accept residual risk."
